name: scheduler tick

# Backup heartbeat only. The real 5-minute clock is a self-scheduling Vercel Queues message
# (app/api/queues/heartbeat); each tick here also re-seeds it in case the chain ever breaks.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Run one scheduler pass
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sS --fail-with-body --max-time 300 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/tick"
